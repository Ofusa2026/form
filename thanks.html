<style>
  :root{ --ink:#1f2933; --muted:#6b7280; --line:#e2e5ea; --bg:#f6f7f9;
    --accent:#0f766e; --accent-soft:#e6f2f0; }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:"Hiragino Kaku Gothic ProN","Noto Sans JP",system-ui,-apple-system,sans-serif;
    line-height:1.7;display:flex;min-height:100vh;align-items:center;justify-content:center;padding:24px}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;
    max-width:520px;width:100%;padding:36px 28px;text-align:center}
  .mark{width:64px;height:64px;border-radius:50%;background:var(--accent-soft);
    color:var(--accent);display:grid;place-items:center;margin:0 auto 18px;font-size:32px;font-weight:800}
  h1{font-size:22px;margin:0 0 10px}
  p{font-size:14px;color:#374151;margin:8px 0}
  .muted{color:var(--muted);font-size:13px}
  .firm{margin-top:24px;border-top:1px solid var(--line);padding-top:18px}
  .firm-t{font-size:12px;color:var(--muted);letter-spacing:.1em}
  .firm-n{font-size:16px;font-weight:700;margin-top:4px}
  .firm-c{font-size:13px;color:var(--muted);margin-top:4px}
  .firm-c a{color:var(--accent);text-decoration:none}
  .back{display:inline-block;margin-top:22px;font-size:13px;color:var(--accent);text-decoration:none}
  @media(max-width:520px){ .card{padding:28px 18px} h1{font-size:19px} }
</style>
</head>
<body>
  <div class="card">
    <div class="mark">✓</div>
    <h1>送信が完了しました</h1>
    <p>お申し込みありがとうございます。</p>
    <p>担当者が内容を確認のうえ、ご連絡いたします。<br>今しばらくお待ちください。</p>
    <p class="muted">※ ご入力いただいたメールアドレス宛に、追ってご連絡する場合があります。</p>

    <div class="firm">
      <div class="firm-t">お問い合わせ</div>
      <div class="firm-n">大房行政書士法人</div>
      <div class="firm-c"><a href="tel:0364248849">03-6424-8849</a>　担当：中林／町田／宮澤</div>
    </div>

    <a class="back" href="gijinkoku-lp.html">トップページへ戻る</a>
  </div>
</body>
